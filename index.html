<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChemCorp — Organic Chemistry Idle Lab</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="news" class="news"><span id="news-text"></span></div>

    <div class="subline" id="h-mrate">&nbsp;</div>

  <div class="goal" id="goal"></div>
  <main id="view"></main>
  <div id="toasts"></div>
  <div id="modal" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/data/tech.js"></script>
  <script src="js/data/academy.js"></script>

  <script src="js/data/school.js"></script>
  <script src="js/data/mechanisms.js"></script>
  <script src="js/data/routes.js"></script>
  <script src="js/data/metro.js"></script>
  <script src="js/data/figures.js"></script>
  <script src="js/game.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/school.js"></script>
  <script src="js/molecule.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</html>
